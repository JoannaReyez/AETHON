<section class="orders-page">
  <div class="orders-header">
    <div>
      <div class="section-tag"><i class="bi bi-card-list"></i> Mis Compras</div>
      <h2>Historial de pedidos</h2>
      <p>Revisa el estado de tus compras con un historial estático y moderno.</p>
    </div>
  </div>

  <div class="orders-list">
    <article class="order-card" *ngFor="let order of store.orders()">
      <div class="order-head">
        <div>
          <h3>Pedido #{{ order.id }}</h3>
          <span>{{ order.date }}</span>
        </div>
        <div class="order-status" [class.entregado]="order.status === 'entregado'" [class.proceso]="order.status === 'en proceso'" [class.cancelado]="order.status === 'cancelado'">
          {{ order.status | titlecase }}
        </div>
      </div>
      <div class="order-grid">
        <div class="order-items">
          <h4>Productos</h4>
          <ul>
            <li *ngFor="let item of order.items">
              <strong>{{ item.quantity }}x</strong>
              <span>{{ item.name }}</span>
              <em>{{ item.price }}</em>
            </li>
          </ul>
        </div>
        <div class="order-summary">
          <span>Total</span>
          <strong>${{ order.total }}</strong>
        </div>
      </div>
    </article>
  </div>
</section>
